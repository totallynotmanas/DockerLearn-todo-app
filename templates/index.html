<!doctype html>
<html>
  <head><title>To-Do List</title></head>
  <body>
    <h1>My To-Do List</h1>
    <form action="/add" method="post">
      <input type="text" name="task" placeholder="Enter task">
      <input type="submit" value="Add">
    </form>
    <ul>
      {% for todo in todos %}
        <li>{{ todo['task'] }}</li>
      {% endfor %}
    </ul>
  </body>
</html>
